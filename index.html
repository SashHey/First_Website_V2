<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Site</title>
</head>
<body>
    <!--My navigation list (unorganized / bullet points)-->
    <ul>
        <li>Home</li>
        <li>About Us</li>
        <li>Our Services</li>
        <li>Gallery</li>
        <li>Contact Us</li>
    </ul>

    <!--Heading and Sub-Heading here (Added "title" to Heading so that when I hover over
    the heading, a little note pops up!)-->
    <h1 title="Breaking_News!">Weather Forecast</h1>
    <h3>The Latest in Cape Town</h3>

    <!--Paragraph here (Added bold and italic to my text)-->
    <p>The <strong>quick</strong> brown fox jumps over the <em>lazy</em> dog</p>
    
    <!--Added organized list (numbered 1 to 3) for different weather conditions-->
    <h2>Weather List</h2>
    <ol>
        <li>Sunny</li>
        <li>Rainy</li>
        <li>Cloudy</li>
    </ol>
</body>
</html>
